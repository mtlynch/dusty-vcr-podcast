{{ define "content" }}
  <h1>{{ .Title }}</h1>
  <div class="episode-wrapper">
    <p class="date">
      {{ .Date.Format (.Site.Params.dateFormat | default "January 2, 2006") }}
    </p>

    {{ with .Params.image }}
      <img src="{{ printf "%s/%s" $.RelPermalink . }}" />
    {{ end }}
    {{ partial "tags" . }}


    <div class="content">{{ .Content }}</div>

    {{ partial "player.html" . }}
  </div>
{{ end }}
